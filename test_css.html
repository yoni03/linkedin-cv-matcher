<!DOCTYPE html>
<html>
<style>
.wrapper {
    position: relative;
    width: 400px;
    height: 100px;
    border: 1px solid black;
}
.shared {
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 10px;
    box-sizing: border-box;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
    border: none;
    width: 100%;
    height: 100%;
}
.backdrop {
    position: absolute;
    top: 0; left: 0;
    color: red;
    z-index: 1;
}
.textarea {
    position: absolute;
    top: 0; left: 0;
    color: transparent;
    caret-color: black;
    background: transparent;
    z-index: 2;
    resize: none;
    outline: none;
}
</style>
<body>
<div class="wrapper">
    <div class="shared backdrop">This is some text with <span style="color: blue">BLUE</span> and red.</div>
    <textarea class="shared textarea">This is some text with BLUE and red.</textarea>
</div>
</body>
</html>
