name: Build Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller app.py --name "LinkedIn_CV_Matcher" --onedir --noconfirm --collect-all gradio

      - name: Zip the Build Directory
        run: |
          Compress-Archive -Path dist\LinkedIn_CV_Matcher\* -DestinationPath LinkedIn_CV_Matcher_Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn_CV_Matcher_Windows
          path: LinkedIn_CV_Matcher_Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller app.py --name "LinkedIn CV Matcher" --windowed --noconfirm --collect-all gradio

      - name: Zip the App Bundle
        run: |
          cd dist
          zip -r ../LinkedIn_CV_Matcher_Mac.zip "LinkedIn CV Matcher.app"

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn_CV_Matcher_Mac
          path: LinkedIn_CV_Matcher_Mac.zip
