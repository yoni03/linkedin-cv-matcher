name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller app.py --name "LinkedIn_CV_Matcher" --onedir --noconfirm --collect-all gradio

      - name: Zip the Build Directory
        run: |
          Compress-Archive -Path dist\LinkedIn_CV_Matcher\* -DestinationPath LinkedIn_CV_Matcher_Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LinkedIn_CV_Matcher_Windows
          path: LinkedIn_CV_Matcher_Windows.zip
